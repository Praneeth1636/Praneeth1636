<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <linearGradient id="mesh1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <linearGradient id="mesh2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#mesh1)"/>
  <ellipse cx="200" cy="140" rx="180" ry="120" fill="url(#glow)" filter="url(#blur)"/>
  <ellipse cx="600" cy="120" rx="160" ry="100" fill="url(#glow)" filter="url(#blur)"/>
  <path d="M0 200 Q200 80 400 140 T800 120 L800 280 L0 280 Z" fill="url(#mesh2)" opacity="0.6"/>
  <rect x="80" y="80" width="640" height="120" rx="16" fill="rgba(15,15,35,0.6)" stroke="url(#mesh2)" stroke-width="2" filter="url(#shadow)" opacity="0.95"/>
  <text x="400" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="url(#mesh2)">( 3D · MODERN · ACETERNITY  (</text>
  <text x="400" y="155" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#a5b4fc" opacity="0.9">Build something that stands out</text>
</svg>
