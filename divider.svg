<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 24" width="700" height="24">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="0" y1="12" x2="700" y2="12" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" filter="url(#lineGlow)"/>
  <circle cx="350" cy="12" r="8" fill="url(#lineGrad)" filter="url(#lineGlow)"/>
</svg>
